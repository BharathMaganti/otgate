[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otgate"
version = "0.1.0"
description = "Observability Test Engineering: score telemetry completeness and gate releases on a Visibility Score"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]

[project.scripts]
otgate = "otgate.cli:main"

[tool.setuptools]
packages = ["otgate"]
